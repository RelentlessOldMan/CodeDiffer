<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeDiffer report</title>
<style>
:root {
  --bg: #fbfbfa; --panel: #ffffff; --fg: #1d1f21; --muted: #6a6f75; --border: #dfe1e4; --hover: #f1f3f5;
  --accent: #2f6fde; --warn-bg: #fff5d6; --warn-fg: #6b4e00;
  --add-bg: #e6f6ea; --add-hl: #b5e5c0; --del-bg: #fdecec; --del-hl: #f6c2c2; --hunk-bg: #eef3fb; --meta-fg: #59606b;
  --t-M: #b26b00; --t-A: #1f8a3b; --t-D: #c4372f; --t-R: #6c4fc4; --t-eq: #7b8088;
  --t-CF: #c4372f; --t-MG: #1f8a3b; --t-AG: #2f6fde; --t-v1: #b26b00; --t-v2: #6c4fc4;
  --v1-bg: #fff1dc; --base-bg: #eef0f3; --v2-bg: #efe9fc; --mk-bg: #e3e6ea; --tag-fg: #ffffff;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171a; --panel: #1c1f23; --fg: #e3e5e8; --muted: #9aa1a9; --border: #30353b; --hover: #252a30;
    --accent: #6ea0ff; --warn-bg: #3a3014; --warn-fg: #f2d68a;
    --add-bg: #12301c; --add-hl: #1f5a33; --del-bg: #3a1a1a; --del-hl: #6b2a2a; --hunk-bg: #1d2738; --meta-fg: #a3abb5;
    --t-M: #e2a14a; --t-A: #5fcf7d; --t-D: #f07a72; --t-R: #a993f0; --t-eq: #8a9099;
    --t-CF: #f07a72; --t-MG: #5fcf7d; --t-AG: #6ea0ff; --t-v1: #e2a14a; --t-v2: #a993f0;
    --v1-bg: #3a2c14; --base-bg: #262a30; --v2-bg: #2b2340; --mk-bg: #30353b; --tag-fg: #15171a;
  }
}
:root[data-theme="dark"] {
  --bg: #15171a; --panel: #1c1f23; --fg: #e3e5e8; --muted: #9aa1a9; --border: #30353b; --hover: #252a30;
  --accent: #6ea0ff; --warn-bg: #3a3014; --warn-fg: #f2d68a;
  --add-bg: #12301c; --add-hl: #1f5a33; --del-bg: #3a1a1a; --del-hl: #6b2a2a; --hunk-bg: #1d2738; --meta-fg: #a3abb5;
  --t-M: #e2a14a; --t-A: #5fcf7d; --t-D: #f07a72; --t-R: #a993f0; --t-eq: #8a9099;
  --t-CF: #f07a72; --t-MG: #5fcf7d; --t-AG: #6ea0ff; --t-v1: #e2a14a; --t-v2: #a993f0;
  --v1-bg: #3a2c14; --base-bg: #262a30; --v2-bg: #2b2340; --mk-bg: #30353b; --tag-fg: #15171a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1400px; margin: 0 auto; padding: 20px 16px 60px; }
h1 { font-size: 20px; margin: 0 0 6px; font-weight: 600; }
.roots { font-family: var(--mono); font-size: 12.5px; color: var(--muted); display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 10px; }
.roots b { color: var(--fg); font-weight: 600; }
.roots span { overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
.notes { margin: 12px 0 0; padding: 0; list-style: none; }
.notes li { background: var(--warn-bg); color: var(--warn-fg); border-radius: 6px; padding: 7px 10px; margin-top: 6px; font-size: 13px; }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 12px; }
.tile { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; min-width: 104px; cursor: pointer; text-align: left; color: inherit; font: inherit; }
.tile .n { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; display: block; }
.tile .l { font-size: 12px; color: var(--muted); }
.tile.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.tile:disabled { cursor: default; opacity: .6; }
.tile.info { cursor: default; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; position: sticky; top: 0; background: var(--bg); padding: 8px 0; z-index: 2; border-bottom: 1px solid var(--border); }
.controls input[type=search] { flex: 1 1 260px; min-width: 0; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--fg); font: inherit; }
.controls select, .controls button { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--fg); font: inherit; cursor: pointer; }
.controls button.on { border-color: var(--accent); color: var(--accent); }
.seg { display: inline-flex; }
.seg button { border-radius: 0; }
.seg button:first-child { border-radius: 6px 0 0 6px; }
.seg button:last-child { border-radius: 0 6px 6px 0; margin-left: -1px; }
.shown { color: var(--muted); font-size: 12.5px; margin-left: auto; }
.tree { margin-top: 8px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; position: relative; min-height: 60px; overflow-anchor: none; }
/* Only the rows on screen exist: each is placed by script, and every row is exactly 27px (ROWH in the script). */
.tree > .row, .tree > .panel { position: absolute; left: 0; right: 0; }
.row { display: flex; align-items: center; gap: 8px; padding: 0 10px; height: 27px; border-bottom: 1px solid var(--border); cursor: pointer; min-width: 0; }
.row:hover { background: var(--hover); }
.row .caret { width: 12px; flex: none; color: var(--muted); font-size: 10px; }
.row .name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 13px; }
.row.dir .name { font-weight: 600; }
.row .extra { flex: none; color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row .warn { color: var(--warn-fg); background: var(--warn-bg); border-radius: 4px; padding: 0 5px; font-size: 11.5px; flex: none; }
.tag { flex: none; font: 600 11px/18px var(--mono); min-width: 22px; text-align: center; border-radius: 4px; color: var(--tag-fg); padding: 0 4px; }
.badges { display: flex; gap: 4px; flex: none; }
.badges .tag { font-weight: 500; }
.panel { border-bottom: 1px solid var(--border); background: var(--bg); padding: 8px 10px 12px; }
.panel .head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
.panel .head a { color: var(--accent); }
.panel .head .w { color: var(--warn-fg); background: var(--warn-bg); padding: 2px 6px; border-radius: 4px; }
.panel .msg { font-size: 13px; color: var(--muted); }
.diff { overflow-x: auto; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); }
table.d { border-collapse: collapse; font: 12.5px/1.5 var(--mono); width: 100%; }
table.d td { padding: 0 8px; white-space: pre; vertical-align: top; }
table.d td.ln { color: var(--muted); text-align: right; user-select: none; width: 1%; border-right: 1px solid var(--border); }
table.d td.sg { width: 1%; user-select: none; color: var(--muted); padding: 0 2px 0 6px; }
table.d tr.add td.tx, table.d tr.add td.sg { background: var(--add-bg); }
table.d tr.del td.tx, table.d tr.del td.sg { background: var(--del-bg); }
table.d .hl-add { background: var(--add-hl); border-radius: 2px; }
table.d .hl-del { background: var(--del-hl); border-radius: 2px; }
table.d tr.hunk td { background: var(--hunk-bg); color: var(--meta-fg); }
table.d tr.meta td { color: var(--meta-fg); font-weight: 600; }
table.d tr.v1 td.tx { background: var(--v1-bg); }
table.d tr.base td.tx { background: var(--base-bg); }
table.d tr.v2 td.tx { background: var(--v2-bg); }
table.d tr.mk td { background: var(--mk-bg); font-weight: 600; }
table.d tr.void td { background: var(--hover); }
/* Side by side: two equal panes, each scrolling on its own axis (kept in step by script). Every row is one line
   high, an empty one too, so the two tables stay row for row. */
.split .meta-head { border-radius: 6px 6px 0 0; border-bottom: 0; }
.split .meta-head + .panes .pane { border-top-left-radius: 0; border-top-right-radius: 0; }
.panes { display: flex; }
.panes .pane { flex: 1 1 0; min-width: 0; }
.panes .pane + .pane { border-left: 0; border-top-left-radius: 0; border-bottom-left-radius: 0; }
.panes .pane:first-child { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.panes table.d td { height: 1.5em; }
.panes table.d td.ln { position: sticky; left: 0; z-index: 1; background: var(--panel); }
.panes table.d tr.void td.ln { background: var(--hover); }
.cnav button { padding: 2px 8px; border: 1px solid var(--border); border-radius: 5px; background: var(--panel); color: var(--fg); cursor: pointer; font: inherit; font-size: 12px; }
.empty { padding: 24px; text-align: center; color: var(--muted); }
footer { margin-top: 18px; color: var(--muted); font-size: 12px; }
@media (max-width: 640px) {
  .row .extra { display: none; }
  .shown { margin-left: 0; width: 100%; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">CodeDiffer report</h1>
    <div class="roots" id="roots"></div>
    <div class="meta" id="meta"></div>
    <ul class="notes" id="notes"></ul>
  </header>
  <div class="tiles" id="tiles"></div>
  <div class="controls">
    <input type="search" id="q" placeholder="Filter paths: text, or a glob like src/**/*.c" aria-label="Filter paths">
    <select id="reason" aria-label="Reason" hidden></select>
    <span class="seg" role="group" aria-label="Diff layout">
      <button type="button" id="m-inline" class="on">Inline</button><button type="button" id="m-split">Side by side</button>
    </span>
    <button type="button" id="expand">Expand all</button>
    <button type="button" id="collapse">Collapse all</button>
    <span class="shown" id="shown"></span>
  </div>
  <div class="tree" id="tree"><div class="empty">Loading…</div></div>
  <footer id="foot"></footer>
</main>
<script>
"use strict";
// Every value from the data files is inserted with textContent / DOM properties — never as HTML.
var CD = (function () {
  var meta = null, L = null, diffs = {}, waiting = {};
  var state = { tags: new Set(), q: "", reason: "", mode: "inline" };
  var TAGS2 = [["M", "modified", "modified"], ["A", "added", "added"], ["D", "removed", "removed"], ["R", "renamed", "renamed"], ["=", "identical", "identical"]];
  var TAGS3 = [["CF", "conflict", "conflict"], ["MG", "merged", "merged cleanly"], ["AG", "agreed", "agreed"], ["v1", "v1only", "v1 only"], ["v2", "v2only", "v2 only"]];
  var COLOR = { "M": "--t-M", "A": "--t-A", "D": "--t-D", "R": "--t-R", "=": "--t-eq", "CF": "--t-CF", "MG": "--t-MG", "AG": "--t-AG", "v1": "--t-v1", "v2": "--t-v2" };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = String(text);
    return e;
  }
  function $(id) { return document.getElementById(id); }
  function fmt(n) { return Number(n).toLocaleString("en-US"); }
  function bytes(b) {
    if (b >= 1073741824) return (b / 1073741824).toFixed(1) + " GB";
    if (b >= 1048576) return (b / 1048576).toFixed(1) + " MB";
    if (b >= 1024) return (b / 1024).toFixed(1) + " KB";
    return b + " B";
  }
  function clock(s) {
    s = Math.round(s); var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
    return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0");
  }
  function tagEl(t, text) {
    var e = el("span", "tag", text === undefined ? t : text);
    e.style.background = "var(" + (COLOR[t] || "--t-eq") + ")";
    return e;
  }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  // ---- data entry points (called by data/index.js and data/d/N.js) ----

  // data/index.js: CD.index(meta, list) — the list as JSON text (HtmlReport.EncodeFiles): each path as a folder
  // number + a file name over one folder table, every other key a column, repeated text stored once.
  function index(data, listText) {
    meta = data;
    L = decode(JSON.parse(listText));
    var tags = meta.kind === "compare3" ? TAGS3 : TAGS2;
    tags.forEach(function (t) { if (t[0] !== "=") state.tags.add(t[0]); });
    var m = store("codediffer.mode"); if (m === "split" || m === "inline") state.mode = m;
    header(); tiles(); controls(); setupTree(); render();
  }

  function decode(j) {
    var nd = j.dp.length, dirPath = new Array(nd), str = {}, sparse = {};
    dirPath[0] = "";
    for (var d = 1; d < nd; d++) dirPath[d] = j.dp[d] === 0 ? j.dn[d] : dirPath[j.dp[d]] + "/" + j.dn[d]; // parents first
    j.str.forEach(function (k) { str[k] = true; });
    Object.keys(j.s).forEach(function (k) {
      var a = j.s[k], m = new Map();
      for (var i = 0; i + 1 < a.length; i += 2) m.set(a[i], a[i + 1]);
      sparse[k] = m;
    });
    return { n: j.n, fd: j.fd, fn: j.fn, dp: j.dp, dn: j.dn, dirPath: dirPath, S: j.S, str: str, c: j.c, s: sparse,
      keys: Object.keys(j.c).concat(Object.keys(j.s)) };
  }

  function raw(k, i) { var c = L.c[k]; var v = c ? c[i] : L.s[k] ? L.s[k].get(i) : undefined; return v === null ? undefined : v; }
  function val(k, i) { var v = raw(k, i); return v !== undefined && L.str[k] ? L.S[v] : v; }
  function path(i) { var d = L.fd[i]; return d === 0 ? L.fn[i] : L.dirPath[d] + "/" + L.fn[i]; }
  // One file's row as an object, made only for rows on screen and opened files.
  function row(i) {
    var f = { i: i, p: path(i) };
    L.keys.forEach(function (k) { var v = val(k, i); if (v !== undefined) f[k] = v; });
    return f;
  }

  function diff(i, d) {
    diffs[i] = d;
    (waiting[i] || []).forEach(function (cb) { cb(d); });
    delete waiting[i];
  }

  function load(i, cb) {
    if (diffs[i]) return cb(diffs[i]);
    if (waiting[i]) { waiting[i].push(cb); return; }
    waiting[i] = [cb];
    var s = document.createElement("script");
    s.src = "data/d/" + i + ".js";
    s.onerror = function () { var w = waiting[i] || []; delete waiting[i]; w.forEach(function (f) { f(null); }); };
    document.head.appendChild(s);
  }

  // ---- header / tiles / controls ----

  var rootLabels = {};

  function header() {
    var three = meta.kind === "compare3";
    document.title = "CodeDiffer · " + (three ? "3-way " : "") + "compare " + meta.id;
    $("title").textContent = (three ? "3-way compare " : "Compare ") + meta.id;
    var roots = $("roots");
    Object.keys(meta.roots).forEach(function (k) { var b = el("b", null, k); rootLabels[k] = b; roots.appendChild(b); roots.appendChild(el("span", null, meta.roots[k])); });
    var started = new Date(meta.started);
    $("meta").textContent = "Run " + started.toLocaleString() + " · took " + clock(meta.elapsedSeconds) + " · CodeDiffer " + meta.tool +
      (three ? " · " + fmt(meta.baseFiles) + " base files · " + fmt(meta.conflictRegions) + " conflict regions" : "");
    var notes = $("notes");
    (meta.notes || []).forEach(function (n) { notes.appendChild(el("li", null, n)); });
    var r = meta.report;
    var foot = "Diffs: " + fmt(r.rendered) + " rendered";
    if (r.capped) foot += " · " + fmt(r.capped) + " cut at " + fmt(r.maxLines) + " lines or 1 MB (full diff linked)";
    if (r.large) foot += " · " + fmt(r.large) + " large file(s) not block-diffed";
    if (r.notRendered) foot += " · " + fmt(r.notRendered) + " past the " + fmt(r.maxDiffs) + "-file limit";
    if (r.unreadable) foot += " · " + fmt(r.unreadable) + " unreadable";
    if (r.stopped) foot += " · " + fmt(r.stopped) + " not rendered (stopped)";
    if (meta.resultDir) foot += " · saved result: " + meta.resultDir;
    $("foot").textContent = foot;
  }

  function tiles() {
    var box = $("tiles");
    var defs = meta.kind === "compare3" ? TAGS3 : TAGS2;
    defs.forEach(function (d) {
      var n = (meta.counts && meta.counts[d[1]]) || 0;
      var b = el("button", "tile");
      b.type = "button";
      var num = el("span", "n", fmt(n)); num.style.color = "var(" + COLOR[d[0]] + ")";
      b.appendChild(num); b.appendChild(el("span", "l", d[2]));
      var unlisted = d[0] === "=" && !meta.identicalListed;
      if (unlisted) { b.disabled = true; b.title = "Identical files are counted, not listed (re-run the report with --include-identical)"; }
      if (state.tags.has(d[0])) b.classList.add("on");
      b.addEventListener("click", function () {
        if (state.tags.has(d[0])) state.tags.delete(d[0]); else state.tags.add(d[0]);
        b.classList.toggle("on", state.tags.has(d[0]));
        render();
      });
      box.appendChild(b);
    });
  }

  function controls() {
    var q = $("q"), timer = null;
    q.addEventListener("input", function () { clearTimeout(timer); timer = setTimeout(function () { state.q = q.value.trim(); render(); }, 150); });
    if (meta.kind !== "compare3" && meta.reasons && Object.keys(meta.reasons).length > 0) {
      var sel = $("reason"); sel.hidden = false;
      var any = el("option", null, "any reason"); any.value = ""; sel.appendChild(any);
      Object.keys(meta.reasons).forEach(function (k) { var o = el("option", null, k + " (" + fmt(meta.reasons[k]) + ")"); o.value = k; sel.appendChild(o); });
      sel.addEventListener("change", function () { state.reason = sel.value; render(); });
    }
    function setMode(m) {
      state.mode = m; store("codediffer.mode", m);
      // 2-way: "left"/"right" only where the trees are drawn left and right; inline, they are the - and + lines.
      if (rootLabels.left && rootLabels.right) {
        rootLabels.left.textContent = m === "split" ? "left" : "− old";
        rootLabels.right.textContent = m === "split" ? "right" : "+ new";
      }
      $("m-inline").classList.toggle("on", m === "inline"); $("m-split").classList.toggle("on", m === "split");
      drawn.forEach(function (node, key) { if (key.charAt(0) === "2") drawPanel(node, row(+key.slice(2))); });
    }
    $("m-inline").addEventListener("click", function () { setMode("inline"); });
    $("m-split").addEventListener("click", function () { setMode("split"); });
    setMode(state.mode);
    $("expand").addEventListener("click", function () { open.fill(1); reflow(); });
    $("collapse").addEventListener("click", function () { open.fill(0); reflow(); });
  }

  // ---- filtering ----

  function globRe(p) {
    var nameOnly = p.indexOf("/") < 0, rx = "^";
    for (var i = 0; i < p.length; i++) {
      var c = p[i];
      if (c === "*" && p[i + 1] === "*") { if (p[i + 2] === "/") { rx += "(?:.*/)?"; i += 2; } else { rx += ".*"; i++; } }
      else if (c === "*") rx += "[^/]*";
      else if (c === "?") rx += "[^/]";
      else rx += c.replace(/[.+^${}()|[\]\\]/g, "\\$&");
    }
    var re = new RegExp(rx + "$", "i");
    return nameOnly ? function (s) { return re.test(s.slice(s.lastIndexOf("/") + 1)); } : function (s) { return re.test(s); };
  }

  // A test of row i against the filter box, or null. A plain text without "/" can't span a "/", so it is looked
  // for in the folder's path (once per folder) and the file name, never in a million joined paths.
  function matcher() {
    var q = state.q.replace(/\\/g, "/");
    if (!q) return null;
    var slash = q.indexOf("/") >= 0, test;
    if (/[*?]/.test(q)) test = globRe(q);
    else { var low = q.toLowerCase(); test = function (s) { return s.toLowerCase().indexOf(low) >= 0; }; }
    var glob = /[*?]/.test(q), hit = new Int8Array(L.dp.length); // per folder: 0 not yet, 1 matches, 2 doesn't
    return function (i) {
      var from = val("f", i);
      if (from !== undefined && test(from)) return true;
      if (glob) return test(slash ? path(i) : L.fn[i]);
      if (slash) return test(path(i));
      var d = L.fd[i];
      if (hit[d] === 0) hit[d] = test(L.dirPath[d]) ? 1 : 2;
      return hit[d] === 1 || test(L.fn[i]);
    };
  }

  // ---- tree: the list as folders, drawn as a virtual list ----
  //
  // The whole tree is data (typed arrays over folder and row numbers); only the entries on screen are elements.
  // An entry is a folder row, a file row, or an opened file's diff panel under it. Rows are ROWH high; a panel is
  // measured once drawn (a ResizeObserver), so offsets are k*ROWH plus what the panels above add.

  var ROWH = 27, MAXH = 15000000;   // past MAXH px the scrollbar is scaled (browsers cap an element's height)
  var T = [], NT = 0, tagOf = null, kids = null, fstart = null, fidx = null;
  var open = null, openFile = new Set(), panelH = new Map();
  var pass = null, cnt = null, direct = null, total = null, nPass = 0;
  var ek = [], ev = [], edp = [], pList = [], labels = new Map();
  var tree = null, emptyEl = null, drawn = new Map(), raf = 0, ro = null;

  function setupTree() {
    T = (meta.kind === "compare3" ? TAGS3 : TAGS2).map(function (t) { return t[0]; }); NT = T.length;
    var nd = L.dp.length, n = L.n, code = {};
    T.forEach(function (t, j) { code[t] = j; });
    tagOf = new Uint8Array(n);
    for (var i = 0; i < n; i++) tagOf[i] = code[val("t", i)] || 0;
    kids = new Array(nd);
    for (var d = 0; d < nd; d++) kids[d] = [];
    for (d = 1; d < nd; d++) kids[L.dp[d]].push(d);
    kids.forEach(function (k) { if (k.length > 1) k.sort(function (a, b) { return L.dn[a] < L.dn[b] ? -1 : L.dn[a] > L.dn[b] ? 1 : 0; }); });
    fstart = new Int32Array(nd + 1); fidx = new Int32Array(n);
    for (i = 0; i < n; i++) fstart[L.fd[i] + 1]++;
    for (d = 0; d < nd; d++) fstart[d + 1] += fstart[d];
    var at = fstart.slice(0, nd);
    for (i = 0; i < n; i++) fidx[at[L.fd[i]]++] = i;  // a folder's files in row (path) order
    open = new Uint8Array(nd);
    tree = $("tree"); tree.replaceChildren();
    emptyEl = el("div", "empty"); emptyEl.hidden = true; tree.appendChild(emptyEl);
    // Panels are measured as drawn and as their diff arrives; this catches the rest (a narrower window rewraps).
    ro = new ResizeObserver(function (es) {
      var changed = false;
      es.forEach(function (e) { if (measure(e.target)) changed = true; });
      if (changed) schedule();
    });
    window.addEventListener("scroll", schedule, { passive: true });
    window.addEventListener("resize", schedule);
  }

  // Which rows pass the filters, and per folder how many (by tag, for the badges; direct, for merging chains).
  function filterRows() {
    var n = L.n, nd = L.dp.length, m = matcher(), on = T.map(function (t) { return state.tags.has(t); });
    var reason = -2;
    if (state.reason) reason = L.str.r ? L.S.indexOf(state.reason) : state.reason;
    pass = new Uint8Array(n); cnt = new Int32Array(nd * NT); direct = new Int32Array(nd); total = new Int32Array(nd); nPass = 0;
    for (var i = 0; i < n; i++) {
      var t = tagOf[i];
      if (!on[t]) continue;
      if (reason !== -2 && raw("r", i) !== reason) continue;
      if (m && !m(i)) continue;
      pass[i] = 1; nPass++;
      var d = L.fd[i];
      direct[d]++; cnt[d * NT + t]++;
    }
    total.set(direct);
    for (d = nd - 1; d > 0; d--) {  // children come after their parents
      var up = L.dp[d];
      total[up] += total[d];
      for (t = 0; t < NT; t++) cnt[up * NT + t] += cnt[d * NT + t];
    }
  }

  function render() {
    filterRows();
    $("shown").textContent = fmt(nPass) + " of " + fmt(L.n) + " listed file(s) shown";
    emptyEl.hidden = nPass > 0;
    emptyEl.textContent = L.n === 0 ? "No changed files." : "Nothing matches the filters.";
    if (nPass > 0 && nPass <= 300) open.fill(1);
    reflow();
  }

  // The visible tree as entries, folders before files, a folder with no files of its own and one subfolder merged
  // into it ("a/b/c/").
  function flatten() {
    ek = []; ev = []; edp = []; pList = []; labels = new Map();
    if (nPass === 0) return;
    (function walk(d, depth) {
      var ks = kids[d];
      for (var x = 0; x < ks.length; x++) {
        var c = ks[x];
        if (!total[c]) continue;
        var name = L.dn[c], last = c;
        while (!direct[last]) {
          var only = -1, many = false, kk = kids[last];
          for (var y = 0; y < kk.length && !many; y++) if (total[kk[y]]) { if (only < 0) only = kk[y]; else many = true; }
          if (many || only < 0) break;
          name += "/" + L.dn[only]; last = only;
        }
        labels.set(last, name);
        ek.push(0); ev.push(last); edp.push(depth);
        if (open[last]) walk(last, depth + 1);
      }
      for (var k = fstart[d]; k < fstart[d + 1]; k++) {
        var i = fidx[k];
        if (!pass[i]) continue;
        ek.push(1); ev.push(i); edp.push(depth);
        if (openFile.has(i)) { pList.push(ek.length); ek.push(2); ev.push(i); edp.push(depth); }
      }
    })(0, 0);
  }

  // After the entries change: rows are drawn afresh (badges, carets, merged names), open panels are kept.
  function reflow() {
    flatten();
    drawn.forEach(function (node, key) { if (key.charAt(0) !== "2") { node.remove(); drawn.delete(key); } });
    draw();
  }

  function schedule() { if (!raf) raf = requestAnimationFrame(draw); }

  function ph(k) { var h = panelH.get(ev[k]); return h === undefined ? 160 : h; }
  function entryTop(k) {
    var y = k * ROWH;
    for (var j = 0; j < pList.length && pList[j] < k; j++) y += ph(pList[j]) - ROWH;
    return y;
  }
  function entryAt(y) {
    var extra = 0;
    for (var j = 0; j < pList.length; j++) {
      var e = pList[j], top = e * ROWH + extra;
      if (y < top) break;
      var h = ph(e);
      if (y < top + h) return e;
      extra += h - ROWH;
    }
    return Math.max(0, Math.min(ek.length - 1, Math.floor((y - extra) / ROWH)));
  }

  function measure(panel) {
    var h = panel.offsetHeight, i = +panel.dataset.i;
    if (!(h > 0) || panelH.get(i) === h) return false;
    panelH.set(i, h);
    return true;
  }

  // Place the entries on screen; again (a few times at most) while a panel just drawn turns out another height.
  function draw() {
    raf = 0;
    for (var pass = 0; pass < 4; pass++) {
      place();
      var changed = false;
      drawn.forEach(function (node, key) { if (key.charAt(0) === "2" && measure(node)) changed = true; });
      if (!changed) break;
    }
  }

  function place() {
    var vt = entryTop(ek.length), h = Math.min(vt, MAXH), vh = window.innerHeight;
    tree.style.height = h + "px";
    var realTop = Math.max(0, Math.min(h, -tree.getBoundingClientRect().top));
    var scale = vt > h && h > vh ? (vt - vh) / (h - vh) : 1, virtTop = realTop * scale;
    var keep = new Map();
    if (ek.length) {
      var k = entryAt(Math.max(0, virtTop - 400)), y = entryTop(k), end = virtTop + vh + 400;
      for (; k < ek.length && y < end; k++) {
        var key = ek[k] + ":" + ev[k], node = drawn.get(key);
        if (node) drawn.delete(key); else node = make(k);
        node.style.top = (realTop + y - virtTop) + "px";
        keep.set(key, node);
        y += ek[k] === 2 ? ph(k) : ROWH;
      }
    }
    drawn.forEach(function (node) { if (ro) ro.unobserve(node); node.remove(); });
    drawn = keep;
  }

  function make(k) {
    var kind = ek[k], id = ev[k], node;
    if (kind === 2) {
      node = el("div", "panel"); node.dataset.i = id;
      tree.appendChild(node); ro.observe(node);
      drawPanel(node, row(id));
      return node;
    }
    node = kind === 0 ? dirRow(id, edp[k]) : fileRow(id, edp[k]);
    tree.appendChild(node);
    return node;
  }

  function dirRow(d, depth) {
    var row = el("div", "row dir");
    row.style.paddingLeft = (10 + depth * 16) + "px";
    row.appendChild(el("span", "caret", open[d] ? "▼" : "▶"));
    row.appendChild(el("span", "name", labels.get(d) + "/"));
    var badges = el("span", "badges");
    for (var t = 0; t < NT; t++) { var c = cnt[d * NT + t]; if (c) badges.appendChild(tagEl(T[t], T[t] + " " + fmt(c))); }
    row.appendChild(badges);
    row.addEventListener("click", function () { open[d] = open[d] ? 0 : 1; reflow(); });
    return row;
  }

  function fileRow(i, depth) {
    var f = row(i);
    var r = el("div", "row file");
    r.style.paddingLeft = (10 + depth * 16 + 12) + "px";
    r.appendChild(tagEl(f.t));
    var base = f.p.slice(f.p.lastIndexOf("/") + 1);
    var name = el("span", "name", f.f ? f.f + " → " + base : base);
    name.title = f.f ? f.f + " → " + f.p : f.p;
    r.appendChild(name);
    if (f.w) { var w = el("span", "warn", "changed since"); w.title = f.w; r.appendChild(w); }
    r.appendChild(el("span", "extra", extra(f)));
    r.addEventListener("click", function () {
      if (openFile.has(i)) openFile.delete(i); else openFile.add(i);
      var key = "2:" + i, p = drawn.get(key);
      if (p && !openFile.has(i)) { ro.unobserve(p); p.remove(); drawn.delete(key); }
      reflow();
    });
    return r;
  }

  function extra(f) {
    var bits = [];
    if (meta.kind === "compare3") {
      bits.push("v1 " + f.s1 + " · v2 " + f.s2);
      if (f.ck && f.ck !== "content") bits.push(f.ck); // "content" is already implied by the two sides
      if (f.c !== undefined) bits.push(f.c + " conflict / " + f.cl + " clean");
    } else {
      if (f.r) bits.push(f.r);
      if (f.a !== undefined) bits.push("+" + fmt(f.a) + " −" + fmt(f.x) + (f.co ? " (coarse)" : ""));
      else if (f.k && f.k !== "text") bits.push(f.k);
      if (f.sim !== undefined) bits.push(Math.floor(f.sim / 10) + "% similar" + (f.ed && f.sim >= 995 ? " (but edited)" : ""));
      bits.push(f.t === "A" ? bytes(f.rs) : f.t === "D" ? bytes(f.ls) : f.ls === f.rs ? bytes(f.rs) : bytes(f.ls) + " → " + bytes(f.rs));
    }
    if (f.n) bits.push("ⓘ");
    return bits.join(" · ");
  }

  // ---- one file's panel ----

  function drawPanel(panel, f) {
    panel.replaceChildren();
    var head = el("div", "head");
    head.appendChild(el("span", null, f.f ? f.f + " → " + f.p : f.p));
    if (f.k) head.appendChild(el("span", null, f.k));
    if (f.co) head.appendChild(el("span", "w", "coarse: too many changes to align exactly, one hunk wider than the change (its +/− counts are of that hunk)"));
    if (f.n) head.appendChild(el("span", null, f.n));
    if (f.w) head.appendChild(el("span", "w", f.w));
    panel.appendChild(head);
    if (!f.d) { if (!f.n) panel.appendChild(el("div", "msg", "No diff for this file.")); return; }
    var body = el("div", "msg", "Loading diff…");
    panel.appendChild(body);
    load(f.i, function (d) {
      if (!panel.isConnected) return; // scrolled away or closed: drawn again from the cache when back
      if (!d) { body.textContent = "This file's diff could not be loaded (data/d/" + f.i + ".js is missing)."; return; }
      if (d.mode === "merge" && d.blocks) {
        head.appendChild(el("span", null, d.full
          ? "showing " + fmt(d.shownBlocks) + " of " + fmt(d.blocks) + " conflict blocks (" + fmt(d.shown) + " of " + fmt(d.total) + " lines)"
          : fmt(d.blocks) + " conflict block(s) with context · " + fmt(d.total) + " lines in the merged file"));
      } else if (d.full) {
        head.appendChild(el("span", null, "showing " + fmt(d.shown) + " of " + fmt(d.total) + " lines"));
      }
      if (d.full) {
        var a = el("a", null, "whole " + (d.mode === "merge" ? "merged file" : "patch"));
        a.href = d.full; // a relative path we wrote ourselves (full/N.*), never data from the trees
        head.appendChild(a);
      }
      var view = d.mode === "merge" ? mergeView(d, head) : (state.mode === "split" ? splitView(parse(d.text)) : inlineView(parse(d.text)));
      body.replaceWith(view);
      if (view.fit) view.fit();
      if (panel.dataset.i !== undefined && measure(panel)) draw();
    });
  }

  // Unified patch -> rows: {k: meta|hunk|ctx|add|del|nonl, t: text, o: old line, n: new line}
  function parse(text) {
    var out = [], o = 0, n = 0, inHunk = false;
    var lines = text.split("\n"); if (lines.length && lines[lines.length - 1] === "") lines.pop();
    lines.forEach(function (l) {
      var m = /^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/.exec(l);
      if (m) { o = +m[1]; n = +m[2]; inHunk = true; out.push({ k: "hunk", t: l }); return; }
      if (l.indexOf("diff --git ") === 0 || l.indexOf("--- v1's change") === 0 || l.indexOf("--- v2's change") === 0) inHunk = false;
      if (!inHunk) { out.push({ k: "meta", t: l }); return; }
      var c = l.charAt(0);
      if (c === "+") out.push({ k: "add", t: l.slice(1), n: n++ });
      else if (c === "-") out.push({ k: "del", t: l.slice(1), o: o++ });
      else if (c === "\\") out.push({ k: "nonl", t: l });
      else out.push({ k: "ctx", t: l.slice(1), o: o++, n: n++ });
    });
    return out;
  }

  // Changed middle of a paired -/+ line (common prefix/suffix stay plain).
  function spans(td, text, other, cls) {
    if (other === null || other === undefined) { td.textContent = text; return; }
    var p = 0, max = Math.min(text.length, other.length);
    while (p < max && text[p] === other[p]) p++;
    var s = 0;
    while (s < max - p && text[text.length - 1 - s] === other[other.length - 1 - s]) s++;
    if (p === 0 && s === 0) { td.textContent = text; return; }
    td.appendChild(document.createTextNode(text.slice(0, p)));
    if (text.length - s > p) td.appendChild(el("span", cls, text.slice(p, text.length - s)));
    td.appendChild(document.createTextNode(text.slice(text.length - s)));
  }

  // Pair each run of deletions with the following run of additions (for intra-line marks and side by side).
  function blocks(rows) {
    var out = [];
    for (var i = 0; i < rows.length;) {
      if (rows[i].k === "del" || rows[i].k === "add") {
        var dels = [], adds = [];
        while (i < rows.length && rows[i].k === "del") dels.push(rows[i++]);
        while (i < rows.length && rows[i].k === "add") adds.push(rows[i++]);
        out.push({ dels: dels, adds: adds });
      } else out.push(rows[i++]);
    }
    return out;
  }

  function td(cls, text) { var c = el("td", cls); if (text !== undefined && text !== null) c.textContent = String(text); return c; }

  function inlineView(rows) {
    var box = el("div", "diff"), t = el("table", "d");
    blocks(rows).forEach(function (b) {
      if (b.dels) {
        b.dels.forEach(function (r, j) { var tr = el("tr", "del"); tr.append(td("ln", r.o), td("ln"), td("sg", "-")); var x = td("tx"); spans(x, r.t, b.adds[j] && b.adds[j].t, "hl-del"); tr.appendChild(x); t.appendChild(tr); });
        b.adds.forEach(function (r, j) { var tr = el("tr", "add"); tr.append(td("ln"), td("ln", r.n), td("sg", "+")); var x = td("tx"); spans(x, r.t, b.dels[j] && b.dels[j].t, "hl-add"); tr.appendChild(x); t.appendChild(tr); });
        return;
      }
      var tr = el("tr", b.k === "hunk" || b.k === "meta" ? b.k : "");
      if (b.k === "hunk" || b.k === "meta" || b.k === "nonl") { var c = td("tx", b.t); c.colSpan = 4; tr.appendChild(c); }
      else tr.append(td("ln", b.o), td("ln", b.n), td("sg", " "), td("tx", b.t));
      t.appendChild(tr);
    });
    box.appendChild(t);
    return box;
  }

  // Two panes of equal width, one per side, each with its own horizontal scrollbar; scrolling one scrolls the
  // other, so a long line on one side never widens or shifts the other. The patch header (diff --git, ---, +++)
  // goes full width above them; every later row goes into both panes, so they stay row for row.
  function splitView(rows) {
    var box = el("div", "split"), head = el("div", "diff meta-head"), ht = el("table", "d");
    var panes = el("div", "panes"), L = el("div", "diff pane"), R = el("div", "diff pane");
    var lt = el("table", "d"), rt = el("table", "d"), started = false;
    function pair(lcls, lcells, rcls, rcells) {
      var a = el("tr", lcls), b = el("tr", rcls); a.append.apply(a, lcells); b.append.apply(b, rcells);
      if (lcells.length === 1) lcells[0].colSpan = 2;
      if (rcells.length === 1) rcells[0].colSpan = 2;
      lt.appendChild(a); rt.appendChild(b);
    }
    blocks(rows).forEach(function (b) {
      if (b.dels) {
        for (var j = 0; j < Math.max(b.dels.length, b.adds.length); j++) {
          var d = b.dels[j], a = b.adds[j], x = td("tx"), y = td("tx");
          if (d) spans(x, d.t, a && a.t, "hl-del");
          if (a) spans(y, a.t, d && d.t, "hl-add");
          pair(d ? "del" : "void", [td("ln", d ? d.o : null), x], a ? "add" : "void", [td("ln", a ? a.n : null), y]);
        }
        return;
      }
      if (b.k === "hunk") started = true;
      if (b.k === "meta" && !started) { var tr = el("tr", "meta"), c = td("tx", b.t); tr.appendChild(c); ht.appendChild(tr); return; }
      if (b.k === "hunk") {   // each side shows its own range: @@ -13,7 on the left, +13,9 @@ on the right
        var m = /^@@ (-\S+) (\+\S+) @@(.*)$/.exec(b.t);
        pair("hunk", [td("tx", m ? "@@ " + m[1] + " @@" + m[3] : b.t)], "hunk", [td("tx", m ? "@@ " + m[2] + " @@" + m[3] : b.t)]);
        return;
      }
      if (b.k === "meta" || b.k === "nonl") { pair(b.k, [td("tx", b.t)], b.k, [td("tx", "")]); return; }
      pair("", [td("ln", b.o), td("tx", b.t)], "", [td("ln", b.n), td("tx", b.t)]);
    });
    if (ht.rows.length) { head.appendChild(ht); box.appendChild(head); }
    L.appendChild(lt); R.appendChild(rt); panes.append(L, R); box.appendChild(panes);
    // Scrolling either pane moves the other; the follower's own scroll event then finds them equal and stops.
    function follow(from, to) { from.addEventListener("scroll", function () { if (to.scrollLeft !== from.scrollLeft) to.scrollLeft = from.scrollLeft; }); }
    follow(L, R); follow(R, L);
    // Once on the page: both tables as wide as the wider one, so the panes scroll the same distance.
    box.fit = function () {
      var w = Math.max(lt.scrollWidth, rt.scrollWidth);
      if (w) lt.style.minWidth = rt.style.minWidth = w + "px";
    };
    return box;
  }

  // A merged file with diff3 markers, as segments [startLine, text] (conflict blocks with context; the
  // stretches between are collapsed). Colour the v1 / base / v2 sections; a button steps through conflicts.
  function mergeView(d, head) {
    var box = el("div", "diff"), t = el("table", "d"), zone = "", marks = [], next = 1;
    var segs = d.segs || [[1, d.text || ""]];
    function gap(n) {
      var tr = el("tr", "hunk"), c = td("tx", "⋯ " + fmt(n) + " unchanged line(s) ⋯");
      c.colSpan = 2; tr.appendChild(c); t.appendChild(tr);
    }
    segs.forEach(function (seg) {
      var start = seg[0], lines = seg[1].split("\n");
      if (lines.length && lines[lines.length - 1] === "") lines.pop();
      if (start > next) gap(start - next);
      lines.forEach(function (l, k) {
        var tr, mk = true;
        if (l.charAt(l.length - 1) === "\r") l = l.slice(0, -1); // a CRLF file's lines keep their \r
        if (l.indexOf("<<<<<<< v1") === 0) zone = "v1";
        else if (l.indexOf("||||||| base") === 0) zone = "base";
        else if (l === "=======" && zone === "base") zone = "v2";
        else if (l.indexOf(">>>>>>> v2") === 0) zone = "end";
        else mk = false;
        tr = el("tr", mk ? "mk" : zone && zone !== "end" ? zone : "");
        if (mk && zone === "v1") marks.push(tr);
        if (zone === "end") zone = "";
        tr.append(td("ln", start + k), td("tx", l));
        t.appendChild(tr);
      });
      next = start + lines.length;
    });
    if (d.total >= next && d.blocks) gap(d.total - next + 1);
    box.appendChild(t);
    if (marks.length > 0) {
      var nav = el("span", "cnav"), at = -1, label = el("span", null, " ");
      var step = el("button", null, "next conflict ↓");
      step.type = "button";
      step.addEventListener("click", function () { at = (at + 1) % marks.length; marks[at].scrollIntoView({ block: "center" }); label.textContent = " conflict " + (at + 1) + " of " + marks.length + " shown "; });
      nav.append(label, step);
      head.appendChild(nav);
    }
    return box;
  }

  return { index: index, diff: diff };
})();
</script>
<script src="data/index.js" onerror="document.getElementById('tree').replaceChildren(Object.assign(document.createElement('div'), {className: 'empty', textContent: 'data/index.js is missing — the report was not finished.'}))"></script>
</body>
